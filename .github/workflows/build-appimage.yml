name: build-appimage

on:
  workflow_dispatch:
  push:
    branches:
      - ci/appimage-build

permissions:
  contents: read

concurrency:
  group: build-appimage-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch containerized build to forward CI=true
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("node:fs");
          const path = "tools/pack/src/linux.ts";
          const src = fs.readFileSync(path, "utf8");
          const needle = '"${PRODUCTION_INSTALL_PNPM_BIN_ENV}=${CONTAINER_PNPM_PATH}",
  ];';
          const inject = '"${PRODUCTION_INSTALL_PNPM_BIN_ENV}=${CONTAINER_PNPM_PATH}",
    "-e",
    "CI=true",
  ];';
          if (!src.includes(needle)) {
            console.error("anchor not found in tools/pack/src/linux.ts");
            process.exit(1);
          }
          fs.writeFileSync(path, src.replace(needle, inject));
          NODE

      - name: Rebuild tools-pack
        run: pnpm --filter @open-design/tools-pack build

      - name: Build AppImage
        run: |
          set -euo pipefail
          pnpm exec tools-pack linux build \
            --dir "$RUNNER_TEMP/tools-pack" \
            --cache-dir "$RUNNER_TEMP/tools-pack-cache" \
            --namespace appimage-ci \
            --portable \
            --to appimage \
            --containerized \
            --json | tee "$RUNNER_TEMP/appimage-build.json"

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: open-design-appimage-linux-x64
          path: ${{ runner.temp }}/tools-pack/out/linux/namespaces/appimage-ci/builder/*.AppImage
          if-no-files-found: error
          retention-days: 14
